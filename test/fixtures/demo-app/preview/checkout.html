<!doctype html><html><head><meta charset="utf-8"><title>Checkout</title><link rel="stylesheet" href="app.css"></head><body>
<div class="app">
  <div class="bar"><h1>Checkout</h1><button class="close" aria-label="Close checkout">×</button></div>
  <main>
    <p class="intro">Hey Sam, you're almost there. Review your order below.</p>
    <div class="order"><div><span>Trail runners</span><span>$128.00</span></div><div><span>Shipping</span><span>$6.00</span></div><div><b>Total: $134.00</b></div></div>
    <label for="card">Card Number</label>
    <input id="card" placeholder="Enter your card number here">
    <p class="alert" role="alert">Oops! Something went wrong</p>
    <div class="buttons"><button class="primary">Submit</button><button class="secondary">Cancel</button></div>
    <small>By clicking Submit you agree to our Terms of Service.</small>
    <p class="toast">Payment successful!</p>
  </main>
</div></body></html>
